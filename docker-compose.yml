version: '3.8'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - soc-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - soc-network

  kafdrop:
    image: obsidiandynamics/kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    networks:
      - soc-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - soc-network

  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: socdb
      POSTGRES_USER: socuser
      POSTGRES_PASSWORD: socpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - soc-network

  soc-backend:
    build: ./soc-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=soc-secret-key-123
      - DB_NAME=socdb
      - DB_USER=socuser
      - DB_PASSWORD=socpassword
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=soc-logs
      - USE_SQLITE=False
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - soc-network

  soc-consumer:
    build: ./soc-backend
    command: python manage.py run_consumer
    environment:
      - DB_NAME=socdb
      - DB_USER=socuser
      - DB_PASSWORD=socpassword
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=soc-logs
      - USE_SQLITE=False
    depends_on:
      - postgres
      - kafka
      - soc-backend
    networks:
      - soc-network

  log-generator:
    build: ./log-generator
    environment:
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - kafka
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  postgres_data: