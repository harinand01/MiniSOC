{% extends 'dashboard/base.html' %}

{% block content %}
<div class="header">
    <h1>Security Alerts</h1>
</div>

<div class="table-container">
    <h3 style="margin-bottom: 1rem; font-size: 1rem; font-weight: 600;">Attack History</h3>
    <table>
        <thead>
            <tr>
                <th>First Seen</th>
                <th>Last Seen</th>
                <th>Duration</th>
                <th>IP Address</th>
                <th>Attack Type</th>
                <th>Count</th>
                <th>Status</th>
                <th>Reason</th>
            </tr>
        </thead>
        <tbody id="alerts-table">
            <!-- Populated via script -->
        </tbody>
    </table>
</div>

<script>
const ATTACK_TYPE_LABELS = {
    'credential_stuffing': 'Credential Stuffing',
    'brute_force': 'Brute Force',
    'sql_injection': 'SQL Injection',
    'blacklisted_ip': 'Blacklisted IP',
    'suspicious_login': 'Suspicious Login',
    'none': 'None'
};

function formatAttackType(type) {
    return ATTACK_TYPE_LABELS[type] || type || '';
}

function formatDuration(firstSeen, lastSeen) {
    if (!firstSeen || !lastSeen) return '-';
    const diffMs = new Date(lastSeen) - new Date(firstSeen);
    const diffSecs = Math.max(0, Math.floor(diffMs / 1000));
    if (diffSecs === 0) return '< 1s';
    const mins = Math.floor(diffSecs / 60);
    const secs = diffSecs % 60;
    return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch('/api/alerts/?verdict=ATTACK&page_size=50');
        const data = await response.json();
        const table = document.getElementById('alerts-table');
        data.results.forEach(alert => {
            const tr = document.createElement('tr');
            const badgeClass = `verdict-${alert.verdict.toLowerCase()}`;
            const firstSeen = alert.first_seen ? new Date(alert.first_seen).toLocaleString() : new Date(alert.timestamp).toLocaleString();
            const lastSeen = alert.last_seen ? new Date(alert.last_seen).toLocaleString() : new Date(alert.timestamp).toLocaleString();
            const duration = formatDuration(alert.first_seen || alert.timestamp, alert.last_seen || alert.timestamp);
            
            const statusClass = alert.status === 'active' ? 'status-active' : 'status-resolved';
            const statusLabel = alert.status || 'resolved';

            tr.innerHTML = `
                <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--accent-purple);">${firstSeen}</td>
                <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--accent-purple);">${lastSeen}</td>
                <td style="font-size: 0.85rem; font-weight: 500;">${duration}</td>
                <td><a href="/dashboard/ip/${alert.ip_address}/" class="ip-link">${alert.ip_address}</a></td>
                <td style="white-space: nowrap;"><span class="verdict-badge ${badgeClass}">${formatAttackType(alert.attack_type)}</span></td>
                <td style="font-family: 'JetBrains Mono', monospace; font-weight: 700; text-align: center;">${alert.attack_count}</td>
                <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                <td style="color: var(--text-secondary); font-size: 0.75rem;">${alert.reason}</td>
            `;
            table.appendChild(tr);
        });
    } catch (err) {
        console.error(err);
    }
});
</script>
{% endblock %}
